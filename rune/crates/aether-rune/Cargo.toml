[package]
name = "aether-rune"
version = "0.1.0"
edition = "2024"

[dependencies]
aether-core = { path = "../aether-core" }
aether-state = { path = "../aether-state" }
rune = { git = "https://github.com/anomalyco/rune.git", rev = "a7f276c3630f85a06a0230295da4d2bd172d8d3b", default-features = false, features = ["svg", "native-file-dialog", "accessibility", "dbus"] }
rune-kit = { git = "https://github.com/anomalyco/rune.git", rev = "a7f276c3630f85a06a0230295da4d2bd172d8d3b", default-features = false, features = ["markdown"] }
rune-notify = { git = "https://github.com/anomalyco/rune.git", rev = "a7f276c3630f85a06a0230295da4d2bd172d8d3b" }
rodio = { version = "0.21", default-features = false, features = ["playback", "wav"] }
latex-rust = "=3.0.2"
pulldown-cmark = { version = "0.13", default-features = false }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
