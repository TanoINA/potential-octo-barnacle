name: Promote verified update
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Signed release candidate workflow run ID
        required: true
        type: string
      tag:
        description: Exact existing stable vVERSION tag to promote
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: production-update-promotion
  cancel-in-progress: false
jobs:
  promote:
    if: github.repository == 'TanoINA/potential-octo-barnacle' && github.ref == 'refs/heads/main'
    environment: release-promotion
    runs-on: [self-hosted, Linux, X64, aether-release-promotion]
    timeout-minutes: 30
    env:
      AETHER_UPDATE_BASE_URL: ${{ vars.AETHER_UPDATE_BASE_URL }}
      AETHER_WINDOWS_UPDATE_PUBLIC_KEY: ${{ vars.AETHER_WINDOWS_UPDATE_PUBLIC_KEY }}
      AETHER_LINUX_UPDATE_PUBLIC_KEY: ${{ vars.AETHER_LINUX_UPDATE_PUBLIC_KEY }}
      RELEASE_TAG: ${{ inputs.tag }}
      CANDIDATE_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check trusted successful build provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]
          sha="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "$sha" refs/remotes/origin/main
          export RELEASE_SHA="$sha"
          printf 'RELEASE_SHA=%s\nRELEASE_VERSION=%s\n' "$sha" "${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          node --input-type=module <<'JS'
          const response = await fetch(`https://api.github.com/repos/TanoINA/potential-octo-barnacle/actions/runs/${process.env.CANDIDATE_RUN_ID}`, {headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json'}});
          if (!response.ok) throw new Error('Cannot authenticate candidate workflow run');
          const run = await response.json();
          const expectedBranch = run.event === 'push' ? process.env.RELEASE_TAG : run.event === 'workflow_dispatch' ? 'main' : null;
          if (run.conclusion !== 'success' || run.status !== 'completed' || run.path !== '.github/workflows/signed-release.yml' || run.repository?.full_name !== 'TanoINA/potential-octo-barnacle' || run.head_repository?.full_name !== 'TanoINA/potential-octo-barnacle' || !expectedBranch || run.head_sha !== process.env.RELEASE_SHA || run.head_branch !== expectedBranch) throw new Error('Untrusted, unsuccessful or release-mismatched candidate run');
          JS
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-update-candidate
          path: promotion-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - run: cargo build --locked --manifest-path scripts/release-policy-tests/Cargo.toml --bin aether-release-policy-tests
      - name: Verify independently before any public writes
        shell: bash
        run: node scripts/release-pipeline.mjs verify --source "promotion-candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --version "$RELEASE_VERSION" --sha "$RELEASE_SHA"
      - name: Copy immutable bytes, verify destination, replace latest.json last
        shell: bash
        env:
          AETHER_UPDATE_PUBLISH_DIRECTORY: ${{ vars.AETHER_UPDATE_PUBLISH_DIRECTORY }}
        run: |
          set -euo pipefail
          [[ "$AETHER_UPDATE_PUBLISH_DIRECTORY" = /* && -d "$AETHER_UPDATE_PUBLISH_DIRECTORY" ]]
          node scripts/release-pipeline.mjs promote-local --source "promotion-candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --destination "$AETHER_UPDATE_PUBLISH_DIRECTORY" --version "$RELEASE_VERSION" --sha "$RELEASE_SHA"
