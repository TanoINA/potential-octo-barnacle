[package]
name = "aether-agent"
version = "0.3.0"
description = "Native Hermes-core-compatible AI agent powered by Rust and Tauri 2"
authors = ["Tano"]
edition = "2021"

[lib]
name = "aether_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
base64 = "0.22"
semver = "1"
url = "2"
chrono = "0.4"
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Explicit engineer-only isolated smoke harness; not part of shipping defaults.
diagnostics = []
# Recognized by shared source; opt-in only, never enabled for the desktop default.
shared-profile = []

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2.14.1"
reqwest-updater = { package = "reqwest", version = "0.13", default-features = false }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22.1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
dirs = "6.0"
chrono = "0.4"
uuid = { version = "1.10", features = ["v4"] }
regex = "1"
globset = "0.4"
ignore = "0.4"
similar = "2"
html2text = "0.15"
url = "2"
tauri-plugin-global-shortcut = "2.4.1"
rusqlite = { version = "0.32", features = ["bundled", "bundled-full"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
